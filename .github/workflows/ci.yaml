name: ci  # 👈 MUST match the required status check in your repo settings

on:
  push:
    branches:
      - '**'          # Run on all branches
  pull_request:
    branches:
      - main          # Also run on PRs to main

env:
  TF_LOG: INFO
  AWS_REGION: us-east-1

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

  snyk-checks:
    name: Snyk Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Snyk
        uses: snyk/actions/setup@0.4.0   # ✅ Correct version!

      - name: Auth with Snyk
        run: snyk auth ${{ secrets.SNYK_TOKEN }}

      - name: Snyk IaC Scan
        run: snyk iac test --severity-threshold=medium
